  /* Layout: the deck's cover, as a page. Name set huge top-left, blurb on the 4-column grid line, contact row pinned to the foot like the deck's footer. */
  :root {
    --bg: #17171c;
    --panel: #2e2e32;
    --fg: #fafafa;
    --muted: #93939f;
    --rule: #4c4b50;
    --sans: "Test Die Grotesk B", "Helvetica Neue", Arial, sans-serif;
    --lg: 500 clamp(24px, 1.8vw, 34px)/1.2 var(--sans);
    --sm: 400 clamp(17px, 1.15vw, 22px)/1.3 var(--sans);
    --gutter: clamp(16px, 3.4vw, 64px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: clamp(48px, 8vw, 120px);
    padding-block: clamp(24px, 3.2vw, 60px) clamp(24px, 3.4vw, 64px);
    padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
    padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  }
  h1 { margin: 0; font: var(--lg); letter-spacing: -0.015em; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    column-gap: 24px;
  }
  .about {
    grid-column: 3 / 5;
    align-self: start;
    display: flex;
    flex-direction: column;
    gap: 28px;
    max-width: 58ch;
  }
  .lead { margin: 0; font: var(--lg); letter-spacing: -0.015em; }
  .lead span { color: var(--muted); font-weight: 400; }
  .work {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .btn {
    align-self: flex-start;
    display: inline-flex;
    gap: 10px;
    padding-bottom: 4px;
    border-bottom: 1px solid transparent;
    color: var(--fg);
    transition: border-color .2s ease;
    font: var(--sm);
    text-decoration: none;
  }
  .arrow { display: inline-block; transition: transform .25s cubic-bezier(.2,.7,.2,1); }
  .btn:hover { border-bottom-color: var(--fg); }
  .btn:hover .arrow { transform: translateX(4px); }
  .btn:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  footer.grid { row-gap: 20px; align-items: baseline; }
  .link { font: 400 15px/1.35 var(--sans); color: var(--muted); text-decoration: none; width: fit-content; transition: color .2s ease; }
  a.link:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }
  .link.muted { color: var(--muted); }
  @media (max-width: 900px) {
    .about { grid-column: 1 / -1; }
    footer.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 480px) {
    footer.grid { grid-template-columns: 1fr; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
    to { opacity: 1; transform: none; filter: none; }
  }
  h1, .lead, .work, footer .link {
    animation: rise .9s cubic-bezier(.2, .7, .2, 1) both;
  }
  h1 { animation-delay: .05s; }
  .lead { animation-delay: .2s; }
  .work { animation-delay: .44s; }
  footer .link:nth-child(1) { animation-delay: .6s; }
  footer .link:nth-child(2) { animation-delay: .66s; }
  footer .link:nth-child(3) { animation-delay: .72s; }
  footer .link:nth-child(4) { animation-delay: .78s; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>

<div class="page">
  <header>

  </header>

  <main class="grid">
    <section class="about">
      <p class="lead">Senior product designer in Vancouver with 8+ years of experience. <span>Design lead at All Purpose for clients like IBM, Telus and Boeing, and founding designer at Tato.ink.</span></p>
      <div class="work">
        <a class="btn" href="portfolio.html" id="portfolio-link">View portfolio</a>
      </div>
    </section>
  </main>

  <footer class="grid">

</div>
